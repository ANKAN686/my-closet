<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Closet | Wear Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-wrap">
    <nav class="nav">
      <a class="logo" href="/">My Closet</a>
      <ul class="links">
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/items.html">Items</a></li>
        <li><a href="/outfits.html">Outfits</a></li>
        <li><a class="active" href="/wear-logs.html">Wear Logs</a></li>
      </ul>
    </nav>

    <section class="hero">
      <h1>Wear <em>history</em></h1>
      <p>Track when items were worn and tie records to outfit combinations.</p>
    </section>

    <section class="two-col">
      <article class="panel">
        <h3>Add Wear Log</h3>
        <form id="log-form" style="margin-top: 12px;">
          <div>
            <label>User</label>
            <select id="log-user-id" required></select>
          </div>
          <div>
            <label>Item</label>
            <select id="log-item-id" required></select>
          </div>
          <div>
            <label>Outfit (optional)</label>
            <select id="log-outfit-id"></select>
          </div>
          <div>
            <label>Date</label>
            <input id="log-date" type="date" />
          </div>
          <button type="submit">Create Log</button>
        </form>
      </article>

      <article class="panel">
        <h3>Wear Logs</h3>
        <div style="overflow:auto; margin-top: 12px;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Item</th>
                <th>Outfit</th>
              </tr>
            </thead>
            <tbody id="logs-body"></tbody>
          </table>
        </div>
      </article>
    </section>
  </div>

  <script type="module" src="/scripts/wearLogs.js"></script>
</body>
</html>
